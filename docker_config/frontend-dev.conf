upstream units_finance {
    server units_finance:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Units Finance API -- rewrite strips /api/finance/ prefix before
    # forwarding to units-finance. Mirrors docker_config/nginx.conf's prod
    # rule so dev routing matches prod (units-backend's Django dev server has
    # no /api/finance route of its own).
    location /api/finance/ {
        rewrite ^/api/finance/(.*)$ /$1 break;
        proxy_pass http://units_finance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
