events {
   worker_connections 1024;
}

http {
   client_max_body_size 50M;
   server_tokens off;

    upstream units_frontend {
        server units_frontend:80;
    }

   upstream units_backend {
       server units_backend:8000;
   }

   # Redirect HTTP to HTTPS
   server {
       listen 80 default_server;
       server_name _;

    # Exclude static and media from redirect

    location /static/ {
        alias /static/;
    }

    location /media/ {
    proxy_pass http://units_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

       # Redirect everything else to HTTPS
       location / {
           return 301 https://$host$request_uri;
       }
   }

   # HTTPS server for Django app
   server {
       listen 443 ssl http2;
       server_name www.units-api.doqfy.in units-api.doqfy.in;

       ssl_certificate /certs/server.crt;
       ssl_certificate_key /certs/server.key;
       ssl_session_cache shared:SSL:10m;
       ssl_session_timeout 10m;
       ssl_ciphers HIGH:!aNULL:!MD5;

       # Backend location
       location / {
           proxy_pass http://units_backend;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_buffering on;
           proxy_buffers 16 4k;
           proxy_buffer_size 8k;
       }

       # Static and media files
       location /static/ {
           include mime.types;
           alias /static/;
       }

         location /media/ {
        proxy_pass http://units_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

       location = /favicon.ico {
           log_not_found off;
           access_log off;
       }
   }
    
       # HTTPS server for user portal
    server {
        include /etc/nginx/mime.types;
        listen 443 ssl http2;
        server_name www.units.getunits.ai units.getunits.ai;

        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_ciphers HIGH:!aNULL:!MD5;


        root /usr/share/nginx/html;
        index index.html;

        # Enable GZIP compression
        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }



    
}