services:
  postgres:
    image: postgres:15-alpine
    container_name: units_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  nginx_proxy:
    image: nginx:1.13-alpine
    container_name: nginx-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - "./docker_config/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./docker_config/certs:/certs"
      - "./microservices/units-backend/static:/static"
      - "./microservices/units-backend/media:/media"
      - "./microservices/units-frontend/dist/Units/browser:/usr/share/nginx/html"

  units_backend:
    container_name: units_backend
    build:
      context: ./docker_config/units_backend
    working_dir: /home/python/app
    depends_on:
      - postgres
    ports:
      - 8000:8000
    volumes:
    - "./microservices/units-backend:/home/python/app"
    - "./docker_config/units_backend/deploy_commands.sh:/deploy_commands.sh"
    - "./logs:/logs"
    command: 
       - /bin/bash
       - -c
       - |
        echo "Starting django server ..."
        /deploy_commands.sh
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: units_redis
    restart: unless-stopped
    # Backs units-finance's UAE e-invoicing Celery queue (FINANCE_REDIS_URL,
    # DB index 1) and units-backend's own Celery queue
    # (property_management/celery_config.py, REDIS_URL, DB index 0).

  units_backend_celery_worker:
    container_name: units_backend_celery_worker
    build:
      context: ./docker_config/units_backend
    working_dir: /home/python/app
    depends_on:
      - postgres
      - redis
      - units_backend
    volumes:
      - "./microservices/units-backend:/home/python/app"
      - "./logs:/logs"
    command:
      - /bin/bash
      - -c
      - |
        echo "Starting units-backend Celery worker ..."
        celery -A property_management worker -l info
    env_file:
      - .env

  units_backend_celery_beat:
    container_name: units_backend_celery_beat
    build:
      context: ./docker_config/units_backend
    working_dir: /home/python/app
    depends_on:
      - postgres
      - redis
      - units_backend
    volumes:
      - "./microservices/units-backend:/home/python/app"
      - "./logs:/logs"
    command:
      - /bin/bash
      - -c
      - |
        echo "Starting units-backend Celery beat ..."
        celery -A property_management beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env

  units-finance:
    container_name: units_finance
    build:
      context: ./docker_config/units_finance
    working_dir: /home/python/app
    depends_on:
      - postgres
      - redis
    ports:
      - 8001:8001
    volumes:
    - "./microservices/units-finance:/home/python/app"
    - "./docker_config/units_finance/deploy_commands.sh:/deploy_commands.sh"
    - "./logs:/logs"
    command:
       - /bin/bash
       - -c
       - |
        echo "Starting finance django server ..."
        /deploy_commands.sh
    env_file:
      - .env

  units_frontend:
    container_name: units_frontend
    image: nginx:1.13-alpine
    ports:
      - "8002:80"
    volumes:
      - ./microservices/units-frontend/dist/Units/browser:/usr/share/nginx/html
      - ./docker_config/frontend-dev.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      API_URL: ${API_URL}

volumes:
  postgres_data:
